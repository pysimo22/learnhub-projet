<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LearnHub — Cours</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f5f5f5; }
        header { background: #2c3e50; color: white; padding: 20px 40px; }
        header h1 { font-size: 1.8em; }
        nav a { color: #aaa; text-decoration: none; margin-left: 20px; }
        nav a:hover { color: white; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .course-header { background: white; padding: 30px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .course-header .category { background: #3498db; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; }
        .course-header h2 { font-size: 1.8em; color: #2c3e50; margin: 10px 0; }
        .course-header .meta { display: flex; gap: 20px; color: #666; margin-top: 10px; }
        .price { color: #27ae60; font-size: 1.5em; font-weight: bold; margin-top: 10px; }
        .lessons { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .lessons h3 { margin-bottom: 15px; color: #2c3e50; }
        .lesson { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .lesson:last-child { border-bottom: none; }
        .lesson .title { font-weight: bold; color: #2c3e50; }
        .lesson .info { color: #888; font-size: 0.85em; }
        .free-badge { background: #27ae60; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
        .back { color: #3498db; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>🎓 LearnHub</h1>
        <nav>
            <a href="index.html">Catalogue</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="enrollment.html">S'inscrire</a>
        </nav>s
    </header>

    <div class="container">
        <a href="index.html" class="back">← Retour au catalogue</a>
        <div id="course-detail"><p>Chargement...</p></div>
        <div class="lessons" id="lessons" style="margin-top:20px; display:none">
            <h3>📚 Leçons du cours</h3>
            <div id="lessons-list"></div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000/api';
        const id  = new URLSearchParams(window.location.search).get('id');

        async function loadCourse() {
            if (!id) { document.getElementById('course-detail').innerHTML = '<p>Aucun cours sélectionné.</p>'; return; }
            try {
                const res    = await fetch(`${API}/courses/${id}`);
                const course = await res.json();
                document.getElementById('course-detail').innerHTML = `
                    <div class="course-header">
                        <span class="category">${course.category}</span>
                        <h2>${course.title}</h2>
                        <p style="color:#666; margin-top:10px">${course.description || ''}</p>
                        <div class="meta">
                            <span>⭐ ${course.rating?.average || 0} (${course.rating?.count || 0} avis)</span>
                            <span>👥 ${course.enrollmentCount || 0} inscrits</span>
                            <span>📚 ${course.metadata?.totalLessons || 0} leçons</span>
                            <span>🎯 ${course.difficulty}</span>
                        </div>
                        <p class="price">${course.price} €</p>
                    </div>
                `;
                loadLessons();
            } catch(e) {
                document.getElementById('course-detail').innerHTML = '<p style="color:red">Erreur de connexion</p>';
            }
        }

        async function loadLessons() {
            const res     = await fetch(`${API}/courses/${id}/lessons`);
            const data    = await res.json();
            const lessons = data.data || [];
            if (lessons.length === 0) return;
            document.getElementById('lessons').style.display = 'block';
            document.getElementById('lessons-list').innerHTML = lessons.map(l => `
                <div class="lesson">
                    <div>
                        <div class="title">${l.order}. ${l.title}</div>
                        <div class="info">${l.type} • ${l.duration} min</div>
                    </div>
                    ${l.isFree ? '<span class="free-badge">GRATUIT</span>' : '🔒'}
                </div>
            `).join('');
        }

        loadCourse();
    </script>
</body>
</html>
